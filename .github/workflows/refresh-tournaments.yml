name: Refresh tournaments snapshot

# Regenerates lib/data/tournaments.json from the Liquipedia API on a schedule.
# Runs on GitHub's runners (whose IP can reach Liquipedia, unlike most
# datacenter IPs, which are Cloudflare-challenged) and commits only when the data
# changed, which then triggers a normal redeploy.

on:
  schedule:
    # Weekly instead of daily — Liquipedia was rate-limiting requests, and tournaments mostly
    # run on weekends anyway. Monday evening (not morning) gives brackets time to be finalized
    # before the scrape runs.
    - cron: '0 20 * * 1' # every Monday at 20:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-tournaments
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA, not a tag: this job can push to main (which deploys),
      # and a tag can be moved to point at different code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # tsx comes from the lockfile (npm ci), not `npx -y`, which would run whatever version
      # is latest on npm at that moment with write access to the repo.
      - name: Install dependencies
        run: npm ci

      # The script exits non-zero (without writing) if the fetch/parse fails, so
      # a bad run never commits an empty snapshot.
      - name: Regenerate snapshot
        run: npx tsx scripts/refresh-tournaments.ts

      - name: Commit if changed
        run: |
          git add lib/data/tournaments.json public/liquipedia
          if git diff --cached --quiet; then
            echo "No tournament changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh tournaments snapshot"
          git push
