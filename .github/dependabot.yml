# Weekly PRs for outdated or vulnerable dependencies, so an advisory like the Next.js RCE
# doesn't go unnoticed for months.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
